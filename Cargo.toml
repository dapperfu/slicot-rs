[package]
name = "slicot-rs"
version = "0.4.20"
edition = "2021"
rust-version = "1.70"
description = "Pure Rust 1:1 mapping of SLICOT (control and systems) routines"
license = "BSD-3-Clause"
repository = "https://github.com/control2/slicot-rs"
documentation = "https://docs.rs/slicot-rs"
readme = "README.md"
keywords = ["slicot", "control-theory", "linear-algebra", "nalgebra", "systems", "model-reduction"]
categories = ["mathematics", "science"]
exclude = [
  "plans/",
  ".cursor/",
  "tools/",
  "SLICOT-Reference/",
  "fuzz/",
  ".github/",
]

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
num-complex = "0.4"

[dev-dependencies]
criterion = "0.5"
nalgebra = "0.33"

[[bench]]
name = "tb01md"
harness = false

[[bench]]
name = "all_routines"
harness = false

[[bin]]
name = "bench_csv"
path = "src/bin/bench_csv.rs"

[profile.release]
lto = true
codegen-units = 1
